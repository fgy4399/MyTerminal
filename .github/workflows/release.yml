name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run tauri:build:exe

      - name: Prepare portable artifact
        id: portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "manual-${{ github.run_number }}"
          }
          $version = $version -replace '^v', ''
          $version = [Regex]::Replace($version, '[^0-9A-Za-z._-]', '_')
          $assetName = "MyTerminal_${version}_windows_x64_portable.exe"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Path "src-tauri/target/release/myterminal.exe" -Destination "release/$assetName" -Force
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.portable.outputs.asset_name }}
          path: release/${{ steps.portable.outputs.asset_name }}
          if-no-files-found: error

      - name: Publish portable EXE release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: MyTerminal ${{ github.ref_name }}
          body: Windows portable EXE is attached below. This is a standalone executable, not an installer.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/${{ steps.portable.outputs.asset_name }}
